name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dev deps
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check harness api

      - name: Mypy
        run: mypy harness api

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install UI deps
        run: cd ui && npm ci

      - name: ESLint
        run: cd ui && npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dev deps
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest harness/tests api/tests --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install UI deps
        run: cd ui && npm ci

      - name: Jest
        run: cd ui && npm test
