# Grants the harness SA write access to MaaSSubscription CRs for the
# rate_limit_validation scenario (harness/tasks/subscription.py). Cluster-scoped
# ClusterRole/ClusterRoleBinding, NOT the kratos namespace's own Role
# (deploy/rbac.yaml) — a MaaSSubscription only gets reconciled by the MaaS
# controller when it lives in the install's actual tenant namespace (e.g.
# models-as-a-service), which is install-specific and not the kratos
# namespace the harness itself runs in. A namespaced Role bound to `kratos`
# would let the harness create a syntactically-valid CR that the MaaS
# controller never even looks at — see docs/architecture/adrs/ADR-009's
# Update section for the incident this fixes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kratos-maas-subscription-write
rules:
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maassubscriptions"]
    verbs: ["get", "list", "create", "patch", "delete", "replace"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kratos-maas-subscription-write
subjects:
  - kind: ServiceAccount
    name: kratos
    namespace: kratos
roleRef:
  kind: ClusterRole
  name: kratos-maas-subscription-write
  apiGroup: rbac.authorization.k8s.io
