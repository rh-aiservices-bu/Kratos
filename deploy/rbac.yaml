apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kratos
  namespace: kratos
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["maassubscriptions"]
    verbs: ["get", "list", "create", "patch", "delete", "replace"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kratos
  namespace: kratos
subjects:
  - kind: ServiceAccount
    name: kratos
    namespace: kratos
roleRef:
  kind: Role
  name: kratos
  apiGroup: rbac.authorization.k8s.io
