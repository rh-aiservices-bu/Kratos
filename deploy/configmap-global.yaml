apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-global-config
  namespace: kratos
data:
  MAAS_API_URL: "https://maas.apps.cluster-rkmhx.rkmhx.sandbox1230.opentlc.com"
  DEFAULT_MODEL: "RedHatAI/Ministral-3-3B-Instruct-2512" #"publishers/llms/models/redhataiministral-3-3b-instruc" 
  DEFAULT_SUBSCRIPTION: ""  # empty = auto-select highest priority
  NAMESPACE: "kratos"
  KRATOS_IMAGE: "quay.io/rlundber/kratos:0.1"
  DB_PATH: "/data/kratos.db"
  SCENARIOS_DIR: "/app/scenarios"
  # Thanos Querier instant-query endpoint backing MaaS metrics cross-validation (see
  # docs/architecture/adrs/ADR-014, ADR-015, and docs/architecture/maas-metrics-reference.md).
  # The actual PromQL queries live in each scenario's own `metrics_queries:` block
  # (e.g. scenarios/metrics_fill.yaml) rather than here, so they're visible next to
  # the assertions that use them — this stays cluster wiring only.
  MAAS_METRICS_URL: "https://thanos-querier-openshift-monitoring.apps.cluster-rkmhx.rkmhx.sandbox1230.opentlc.com/api/v1/query"
