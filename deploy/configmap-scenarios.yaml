apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-scenarios
  namespace: kratos
data:
  single_key_load.yaml: |
    name: single_key_load
    description: "Baseline load test — one key, N requests through MaaS"
    config:
      request_count: 100
      concurrency: 5
      prompt: "Hello, world!"
    tasks:
      - name: provision_api_key
        params:
          key_name: "kratos-load-key"
      - name: send_requests
        params:
          count: "${config.request_count}"
          concurrency: "${config.concurrency}"
          prompt: "${config.prompt}"
          key_pool: true
        # promql pass-through form (ADR-015): these check pure harness-side numbers
        # (client-observed request results), not a real Prometheus metric — the
        # ${harness.x} literal is sent to Thanos Querier as a bare scalar expression, so
        # this still exercises the real query-firing/parsing path end to end.
        assertions:
          error_rate_pct:
            promql: "${harness.inference_results.error_rate_pct}"
            expect: "< 5"
          p99_latency_ms:
            promql: "${harness.inference_results.p99_latency_ms}"
            expect: "< 10000"
    cleanup: automatic

  multi_key_load.yaml: |
    name: multi_key_load
    description: "Multi-key load test — N keys, M requests distributed evenly across the key pool"
    config:
      key_count: 5
      request_count: 5
      concurrency: 5
      prompt: "Hello, world!"
    tasks:
      - name: provision_api_key
        params:
          key_name: "kratos-multi-key"
          count: "${config.key_count}"
      - name: send_requests
        params:
          count: "${config.request_count}"
          concurrency: "${config.concurrency}"
          prompt: "${config.prompt}"
          key_pool: true
        # promql pass-through form (ADR-015) — see single_key_load.yaml for why.
        assertions:
          error_rate_pct:
            promql: "${harness.inference_results.error_rate_pct}"
            expect: "< 5"
    cleanup: automatic

  direct_inference.yaml: |
    name: direct_inference
    description: "Direct inference — bypasses MaaS gateway, tests the underlying model serving endpoint"
    config:
      target_url: ""
      target_token: ""
      request_count: 50
      concurrency: 5
      prompt: "Hello, world!"
    tasks:
      - name: send_requests
        params:
          url: "${config.target_url}"
          token: "${config.target_token}"
          count: "${config.request_count}"
          concurrency: "${config.concurrency}"
          prompt: "${config.prompt}"
        # promql pass-through form (ADR-015) — see single_key_load.yaml for why. Note
        # this scenario bypasses the MaaS gateway entirely (sends straight to
        # target_url), so there's no real MaaS-side metric to cross-check here — this
        # remains a pure harness-side threshold, just routed through Prometheus.
        assertions:
          error_rate_pct:
            promql: "${harness.inference_results.error_rate_pct}"
            expect: "< 5"
    cleanup: automatic

  rate_limit_validation.yaml: |
    name: rate_limit_validation
    description: "Rate-limit validation — applies a MaaSSubscription CR and asserts throughput stays at or below the configured RPS limit"
    config:
      rate_limit_rps: 10
      request_count: 100
      concurrency: 20
      key_count: 1
      prompt: "Hello, world!"
    tasks:
      - name: apply_rate_limit_subscription
        params:
          rps_limit: "${config.rate_limit_rps}"
      - name: provision_api_key
        params:
          key_name: "kratos-rate-key"
          count: "${config.key_count}"
      - name: send_requests
        params:
          count: "${config.request_count}"
          concurrency: "${config.concurrency}"
          prompt: "${config.prompt}"
          key_pool: true
        # promql pass-through form (ADR-015) — see single_key_load.yaml for why.
        assertions:
          throughput_rps:
            promql: "${harness.inference_results.throughput_rps}"
            expect: "<= ${config.rate_limit_rps}"
          error_rate_pct:
            promql: "${harness.inference_results.error_rate_pct}"
            expect: "< 30"
    cleanup: automatic

  metrics_fill.yaml: |
    name: metrics_fill
    description: "Metrics fill — sends a burst of requests and validates the MaaS metrics pipeline is populated correctly"
    config:
      request_count: 200
      concurrency: 10
      prompt: "Hello, world!"
      metrics_tolerance_pct: 5
      # How long the runner will keep re-polling MaaS metrics after the run finishes,
      # waiting for a fresh Prometheus scrape to actually reflect the sent traffic,
      # before evaluating maas_requests_match/maas_tokens_match. Default (see
      # harness/runner.py) assumes a ~30s scrape interval; raise this if your cluster's
      # is longer or scrapes are less reliable under load.
      metrics_max_wait_s: 65
      # Kuadrant/Limitador scopes its gateway counters by the target model's HTTPRoute
      # name — verified live against cluster-rkmhx.rkmhx.sandbox1230.opentlc.com (see
      # ADR-014). Update this if DEFAULT_MODEL ever changes.
      limitador_namespace: "llm/facebook-opt-125m-simulated-kserve-route"
    # Named PromQL queries this scenario depends on — baseline-snapshotted before the
    # task loop starts and re-polled every 5s, same as before ADR-015, just declared
    # here instead of the global ConfigMap's MAAS_METRICS_QUERIES so the query text
    # lives next to the assertions that use it. Referenced below via ${baseline.<name>}.
    metrics_queries:
      total_requests: 'sum(authorized_calls{limitador_namespace="${config.limitador_namespace}"})'
      total_tokens: 'sum(authorized_hits{limitador_namespace="${config.limitador_namespace}"})'
    tasks:
      - name: provision_api_key
        params:
          key_name: "kratos-metrics-key"
      - name: send_requests
        params:
          count: "${config.request_count}"
          concurrency: "${config.concurrency}"
          prompt: "${config.prompt}"
          key_pool: true
        assertions:
          error_rate_pct:
            promql: "${harness.inference_results.error_rate_pct}"
            expect: "< 5"
          # Self-contained PromQL cross-check (ADR-015): ${baseline.total_requests} nets
          # out the pre-run counter value and ${harness.inference_results.total_requests}
          # splices in the harness's own sent-count, so the whole "does MaaS's reported
          # delta match what we actually sent, within tolerance" check is one expression
          # evaluated by Prometheus itself, using <bool> to fold the comparison into 0/1.
          maas_requests_match:
            promql: >-
              abs(
                (sum(authorized_calls{limitador_namespace="${config.limitador_namespace}"}) - ${baseline.total_requests})
                - ${harness.inference_results.total_requests}
              )
              <= bool (${config.metrics_tolerance_pct} / 100 * clamp_min(${harness.inference_results.total_requests}, 1))
            expect: "== 1"
            max_wait_s: "${config.metrics_max_wait_s}"
          maas_tokens_match:
            promql: >-
              abs(
                (sum(authorized_hits{limitador_namespace="${config.limitador_namespace}"}) - ${baseline.total_tokens})
                - ${harness.inference_results.total_tokens_sent}
              )
              <= bool (${config.metrics_tolerance_pct} / 100 * clamp_min(${harness.inference_results.total_tokens_sent}, 1))
            expect: "== 1"
            max_wait_s: "${config.metrics_max_wait_s}"
    cleanup: automatic
