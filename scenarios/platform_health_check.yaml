name: platform_health_check
description: >-
  End-to-end API-level platform health check — verifies the MaaS stack is
  fully operational as an end user would experience it: models are
  discoverable, a key can be provisioned with auto-selected subscription,
  the key is findable via search, inference succeeds, and revocation takes
  effect immediately. No CR reads or cluster-admin operations — every
  assertion is over the MaaS REST API and inference endpoint.
category: "Platform Health"
config:
  request_count: 3
  concurrency: 1
  prompt: "Hello, world!"
  target_model_name: ""      # optional — blank uses DEFAULT_MODEL; model picker activates when both present
  target_model_namespace: "" # paired with target_model_name
tasks:
  - name: check_platform_health
    assertions:
      model_count:
        promql: "${harness.platform_health.model_count}"
        expect: ">= 1"
  - name: provision_api_key
    params:
      key_name: "maaspal-platform-health-key"
      count: 1
    assertions:
      name_echo_match_count:
        promql: "${harness.key_provision_checks.name_echo_match_count}"
        expect: "== 1"
  - name: verify_api_key_search
    params:
      name_prefix: "maaspal-platform-health-key"
    assertions:
      found_count:
        promql: "${harness.search_check.found_count}"
        expect: "== 1"
  - name: send_requests
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      key_pool: true
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
  - name: revoke_api_keys
    params: {}
  - name: verify_revoked_key_denied
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      key_pool: true
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "> 90"
      unauthorized_count:
        promql: "${harness.inference_results.unauthorized_count}"
        expect: "> 0"
cleanup: automatic
