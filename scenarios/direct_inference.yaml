name: direct_inference
description: "Direct inference — bypasses MaaS gateway, tests the underlying model serving endpoint"
config:
  target_url: ""
  target_token: ""
  target_model: ""
  request_count: 50
  concurrency: 5
  prompt: "Hello, world!"
tasks:
  - name: send_requests
    params:
      url: "${config.target_url}"
      token: "${config.target_token}"
      model: "${config.target_model}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
    # promql pass-through form (ADR-015) — see single_key_load.yaml. Bypasses the
    # MaaS gateway, so there's no real MaaS-side metric to cross-check here.
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
cleanup: automatic
