name: access_denied_no_policy
description: >-
  Access-control fail-closed check — grants a synthetic group quota via a
  MaaSSubscription but deliberately leaves no matching MaaSAuthPolicy for it,
  then asserts the gateway actually denies inference (gateway-default-deny),
  rather than trusting the "quota_without_access" badge the MaaS Setup UI's
  Access Control tab shows for this exact situation (see
  docs/architecture/maas-domain-reference.md Catalog item C).
category: "Access Control"
config:
  subscription_name: "maaspal-fail-closed-test"
  subscription_namespace: "models-as-a-service"  # install-specific tenant namespace; override if yours differs
  target_model_name: ""       # required — the MaaSModelRef's own name, e.g. "facebook-opt-125m-simulated" (not the plain model id)
  target_model_namespace: ""  # required — the namespace that MaaSModelRef lives in, e.g. "llm"
  # A group name chosen specifically to have no corresponding MaaSAuthPolicy
  # on the cluster — the whole point of this scenario is that this group gets
  # quota (below) but never gateway access. Override only if this literal
  # name happens to collide with a real group/policy on your cluster.
  test_group: "maaspal-fail-closed-test"
  # Deliberately generous — rate limiting must not be why requests fail here,
  # or the scenario wouldn't isolate access-control enforcement from
  # rate-limit enforcement (see rate_limit_validation.yaml for that check).
  token_limit: 1000000
  request_count: 20
  concurrency: 5
  key_count: 1
  prompt: "Hello, world!"
tasks:
  - name: apply_rate_limit_subscription
    params:
      subscription_name: "${config.subscription_name}"
      namespace: "${config.subscription_namespace}"
      model_name: "${config.target_model_name}"
      model_namespace: "${config.target_model_namespace}"
      token_limit: "${config.token_limit}"
      owner_groups: ["system:authenticated"]
  - name: provision_api_key
    params:
      key_name: "maaspal-fail-closed-key"
      count: "${config.key_count}"
  - name: send_requests
    params:
      # See rate_limit_validation.yaml for why this is required, not just
      # nice-to-have, once more than one model is registered on the cluster.
      model: "${config.target_model_namespace}/${config.target_model_name}"
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    # promql pass-through form (ADR-015) — see single_key_load.yaml. No real
    # MaaS-side metric distinguishes "denied for lack of auth policy" from
    # any other gateway rejection, so these three harness-side counters
    # together are what actually isolates the failure mode under test:
    # almost everything should fail, none of it via rate limiting, and (once
    # confirmed live — see ADR-018) via an auth denial specifically.
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "> 90"
      rate_limited_count:
        promql: "${harness.inference_results.rate_limited_count}"
        expect: "== 0"
      unauthorized_count:
        promql: "${harness.inference_results.unauthorized_count}"
        expect: "> 0"
cleanup: automatic
