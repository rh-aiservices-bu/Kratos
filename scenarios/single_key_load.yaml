name: single_key_load
description: "Baseline load test — one key, N requests through MaaS"
category: "Load Testing"
config:
  request_count: 100
  concurrency: 5
  prompt: "Hello, world!"
  subscription: ""           # optional — leave blank for auto-selection
  target_model_name: ""      # optional — blank uses DEFAULT_MODEL; model picker activates when both present
  target_model_namespace: "" # paired with target_model_name
tasks:
  - name: provision_api_key
    params:
      key_name: "maaspal-load-key"
      subscription: "${config.subscription}"
  - name: send_requests
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      model: "${config.target_model_namespace}/${config.target_model_name}"
      key_pool: true
    # promql pass-through form (ADR-015) — harness-side values routed through Thanos Querier.
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
      p99_latency_ms:
        promql: "${harness.inference_results.p99_latency_ms}"
        expect: "< 10000"
cleanup: automatic
