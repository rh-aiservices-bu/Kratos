name: single_key_load
description: "Baseline load test — one key, N requests through MaaS"
config:
  request_count: 100
  concurrency: 5
  prompt: "Hello, world!"
tasks:
  - name: provision_api_key
    params:
      key_name: "kratos-load-key"
  - name: send_requests
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
    # promql pass-through form (ADR-015): these check pure harness-side numbers
    # (client-observed request results), not a real Prometheus metric — the
    # ${harness.x} literal is sent to Thanos Querier as a bare scalar expression, so
    # this still exercises the real query-firing/parsing path end to end.
    assertions:
      error_rate_pct:
        promql: "${harness.inference_results.error_rate_pct}"
        expect: "< 5"
      p99_latency_ms:
        promql: "${harness.inference_results.p99_latency_ms}"
        expect: "< 10000"
cleanup: automatic
