name: metrics_fill
description: "Metrics fill — sends a burst of requests and validates the MaaS metrics pipeline is populated correctly"
config:
  request_count: 200
  concurrency: 10
  prompt: "Hello, world!"
  metrics_tolerance_pct: 5
tasks:
  - name: provision_api_key
    params:
      key_name: "kratos-metrics-key"
  - name: send_requests
    params:
      count: "${config.request_count}"
      concurrency: "${config.concurrency}"
      prompt: "${config.prompt}"
      key_pool: true
assertions:
  error_rate_pct: "< 5"
  maas_requests_match:
    compare: metrics.total_requests_delta
    to: inference_results.total_requests
    tolerance_pct: "${config.metrics_tolerance_pct}"
  maas_tokens_match:
    compare: metrics.total_tokens_delta
    to: inference_results.total_tokens_sent
    tolerance_pct: "${config.metrics_tolerance_pct}"
cleanup: automatic
